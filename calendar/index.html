<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=5.0">
    <title>Billy &amp; Julia's Calendar</title>
    <meta name="description" content="A shared space for Billy &amp; Julia's plans and adventures.">

    <!-- PWA / home-screen app -->
    <meta name="theme-color" content="#faf6ef">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Our Calendar">
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.10/index.global.min.js" rel="preload" as="script">
    <style>
        :root {
            /* Warm editorial palette */
            --billy: #6f8769;       /* sage */
            --billy-2: #5f7657;
            --julia: #c2693f;       /* terracotta */
            --julia-2: #b85733;
            --accent: #b0512f;      /* heading terracotta */
            --bg-1: #fbf8f2;
            --bg-2: #f4ece0;
            --ink: #2b2722;
            --muted: #8a7f72;
            --card: #fffdf8;
            --panel: #efe7da;
            --border: #ece3d5;
            --radius: 18px;
            --shadow: 0 16px 44px rgba(120, 90, 60, 0.14);
            --serif: 'Fraunces', Georgia, 'Times New Roman', serif;
            --sans: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            --safe-top: env(safe-area-inset-top, 0px);
            --safe-bottom: env(safe-area-inset-bottom, 0px);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        html, body { height: 100%; }

        body {
            font-family: var(--sans);
            background: var(--bg-2);
            min-height: 100vh;
            color: var(--ink);
            position: relative;
            overflow-x: hidden;
            padding: var(--safe-top) 0 var(--safe-bottom);
            -webkit-font-smoothing: antialiased;
        }

        /* Soft warm aurora */
        .aurora { position: fixed; inset: 0; z-index: -1; overflow: hidden; background: linear-gradient(135deg, var(--bg-1) 0%, var(--bg-2) 100%); }
        .aurora::before, .aurora::after {
            content: ''; position: absolute; width: 60vmax; height: 60vmax; border-radius: 50%;
            filter: blur(80px); will-change: transform;
        }
        .aurora::before { background: radial-gradient(circle, var(--julia) 0%, transparent 65%); opacity: 0.10; top: -16vmax; left: -10vmax; animation: drift1 24s ease-in-out infinite; }
        .aurora::after  { background: radial-gradient(circle, var(--billy) 0%, transparent 65%); opacity: 0.13; bottom: -18vmax; right: -12vmax; animation: drift2 28s ease-in-out infinite; }
        @keyframes drift1 { 0%,100%{transform:translate(0,0) scale(1);} 50%{transform:translate(7vmax,5vmax) scale(1.12);} }
        @keyframes drift2 { 0%,100%{transform:translate(0,0) scale(1);} 50%{transform:translate(-6vmax,-4vmax) scale(1.1);} }
        @media (prefers-reduced-motion: reduce) { .aurora::before, .aurora::after { animation: none; } }

        .container { max-width: 1100px; margin: 0 auto; padding: 22px 16px 120px; }

        header { text-align: center; padding: 16px 0 20px; }
        h1 {
            font-family: var(--serif);
            font-size: clamp(1.7em, 5.2vw, 2.5em);
            font-weight: 600; letter-spacing: -0.01em; color: var(--accent);
            display: inline-flex; align-items: center; gap: 12px; line-height: 1.1;
        }
        h1 .heart { flex: 0 0 auto; filter: drop-shadow(0 2px 4px rgba(176,81,47,.25)); }
        .subtitle { color: var(--muted); margin-top: 8px; font-family: var(--serif); font-style: italic; font-size: 1.02em; }

        .toolbar { display: flex; flex-direction: column; gap: 14px; margin-bottom: 20px; }

        .user-select { display: flex; justify-content: center; gap: 12px; }
        .user-btn { padding: 11px 26px; border: none; border-radius: 999px; cursor: pointer; font-size: 0.95em;
            font-weight: 600; color: #fff; transition: transform .2s ease, box-shadow .2s ease, opacity .2s; opacity: .6; font-family: inherit; }
        .user-btn .who { display: inline-flex; align-items: center; gap: 8px; }
        .user-btn .dot { width: 9px; height: 9px; border-radius: 50%; background: rgba(255,255,255,.92); }
        .user-btn.billy { background: linear-gradient(135deg, #7d9476, #5f7657); }
        .user-btn.julia { background: linear-gradient(135deg, #cf7a4f, #b85733); }
        .user-btn:hover { transform: translateY(-2px); }
        .user-btn.active { opacity: 1; box-shadow: 0 0 0 2px var(--ink), 0 8px 20px rgba(120,90,60,.18); }

        .filters { display: flex; justify-content: center; gap: 8px; flex-wrap: wrap; }
        .chip { padding: 7px 16px; border-radius: 999px; border: 1px solid var(--border); background: var(--panel);
            color: var(--muted); cursor: pointer; font-size: .85em; font-weight: 600; transition: all .2s; font-family: inherit; }
        .chip:hover { color: var(--ink); border-color: #d8cab5; }
        .chip.active { color: #fff; border-color: transparent; background: var(--julia); }

        .cal-shell { position: relative; }
        #calendar {
            background: var(--card); border-radius: var(--radius); padding: 18px;
            border: 1px solid var(--border); box-shadow: var(--shadow); min-height: 360px;
            animation: rise .5s ease both;
        }
        @keyframes rise { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }

        /* FullCalendar theming */
        .fc {
            --fc-border-color: #efe6d8;
            --fc-button-bg-color: #efe7da;
            --fc-button-border-color: transparent;
            --fc-button-hover-bg-color: #e6dac8;
            --fc-button-hover-border-color: transparent;
            --fc-button-active-bg-color: var(--julia);
            --fc-button-text-color: #5b5347;
            --fc-today-bg-color: rgba(194, 105, 63, 0.10);
            --fc-page-bg-color: transparent;
            --fc-neutral-bg-color: #faf6ef;
            --fc-neutral-text-color: var(--ink);
            --fc-list-event-hover-bg-color: #faf3e9;
        }
        .fc .fc-toolbar-title { font-family: var(--serif); font-weight: 600; letter-spacing: -0.01em; color: var(--ink); }
        .fc .fc-button { font-weight: 600; border-radius: 10px !important; text-transform: capitalize; box-shadow: none; }
        .fc .fc-button-primary:not(:disabled).fc-button-active { box-shadow: 0 4px 12px rgba(194,105,63,.28); }
        .fc-theme-standard td, .fc-theme-standard th { border-color: #efe6d8; }
        .fc-col-header-cell-cushion, .fc-daygrid-day-number { color: #9c9081; text-decoration: none; padding: 8px; font-weight: 600; }
        .fc-day-today .fc-daygrid-day-number { color: var(--accent); }

        .fc-event { border: none !important; border-radius: 7px; padding: 0; overflow: hidden; cursor: pointer;
            transition: transform .12s ease, filter .12s ease; }
        .fc-event:hover { transform: translateY(-1px); filter: brightness(1.05); }
        .ev { display: flex; align-items: center; gap: 6px; padding: 3px 7px; font-size: .82em; }
        .ev .badge { flex: 0 0 auto; width: 7px; height: 7px; border-radius: 50%; box-shadow: 0 0 0 1.5px rgba(0,0,0,.12); }
        .ev .badge.billy { background: var(--billy); }
        .ev .badge.julia { background: var(--julia); }
        .ev .t { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-weight: 500; }
        /* Filled (all-day) blocks: white text, hide redundant badge */
        .fc-daygrid-block-event .ev .t { color: #fff; }
        .fc-daygrid-block-event .ev .badge { display: none; }
        /* Dot (timed) + list events: ink text on light background */
        .fc-daygrid-dot-event .ev .t, .fc-list-event .ev .t { color: var(--ink); }
        .fc-list-event .ev { font-size: 1em; }
        .fc-list-event .ev .badge { display: none; }   /* FC already shows a colored dot in agenda */

        /* Selected day highlight in the grid */
        .fc-daygrid-day.dd-selected { box-shadow: inset 0 0 0 2px var(--julia); border-radius: 8px; }

        /* Day detail panel */
        .day-detail { margin-top: 16px; background: var(--card); border: 1px solid var(--border);
            border-radius: var(--radius); box-shadow: var(--shadow); padding: 18px; animation: rise .3s ease both; }
        .day-detail[hidden] { display: none; }
        .day-detail-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
        .day-detail-head h3 { font-family: var(--serif); color: var(--accent); font-size: 1.2em; font-weight: 600; }
        .dd-close { background: var(--panel); border: none; width: 32px; height: 32px; border-radius: 50%;
            cursor: pointer; color: var(--muted); font-weight: 700; font-size: .95em; transition: background .2s; }
        .dd-close:hover { background: #e6dac8; }
        #dayDetailList { display: flex; flex-direction: column; gap: 9px; }
        .dd-empty { color: var(--muted); font-style: italic; padding: 6px 2px; font-family: var(--serif); }
        .dd-row { display: block; width: 100%; text-align: left; background: var(--bg-1);
            border: 1px solid var(--border); border-left: 4px solid var(--billy); border-radius: 12px;
            padding: 11px 13px; cursor: pointer; font-family: inherit; transition: transform .1s, box-shadow .15s; }
        .dd-row:hover { box-shadow: 0 5px 16px rgba(120,90,60,.13); }
        .dd-row:active { transform: scale(.99); }
        .dd-row .dd-title { font-weight: 600; color: var(--ink); font-size: 1em; }
        .dd-row .dd-meta { font-size: .82em; color: var(--muted); margin-top: 3px; display: flex; gap: 8px; flex-wrap: wrap; }
        .dd-row .dd-desc { font-size: .85em; color: #6b6256; margin-top: 7px; white-space: pre-wrap; word-break: break-word; line-height: 1.45; }
        .dd-add { margin-top: 14px; width: 100%; padding: 12px; border: 1px dashed #d4c4ad; background: transparent;
            color: var(--accent); border-radius: 12px; font-weight: 600; cursor: pointer; font-family: inherit; transition: background .2s; }
        .dd-add:hover { background: var(--panel); }

        /* Loading + offline */
        .spinner-wrap { position: absolute; inset: 0; display: none; align-items: center; justify-content: center;
            background: rgba(255,253,248,.6); border-radius: var(--radius); z-index: 5; }
        .spinner-wrap.show { display: flex; }
        .spinner { width: 38px; height: 38px; border-radius: 50%; border: 3px solid rgba(176,81,47,.15);
            border-top-color: var(--julia); animation: spin .8s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }

        .offline-banner { position: fixed; left: 50%; transform: translateX(-50%); top: calc(var(--safe-top) + 10px);
            background: #b45309; color: #fff; padding: 8px 16px; border-radius: 999px; font-size: .85em; font-weight: 600;
            box-shadow: var(--shadow); z-index: 1200; display: none; }
        .offline-banner.show { display: block; }

        /* FAB */
        .fab { position: fixed; right: max(18px, env(safe-area-inset-right)); bottom: calc(20px + var(--safe-bottom));
            width: 62px; height: 62px; border-radius: 50%; border: none; cursor: pointer; z-index: 900;
            background: linear-gradient(135deg, #7d9476, #5f7657); color: #fff; font-size: 1.9em; line-height: 1;
            box-shadow: 0 10px 26px rgba(111,135,105,.42); transition: transform .2s ease, box-shadow .2s ease;
            display: flex; align-items: center; justify-content: center; }
        .fab:hover { transform: translateY(-3px) scale(1.04); }
        .fab:active { transform: scale(.96); }

        /* Install pill */
        .install-pill { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(22px + var(--safe-bottom));
            display: none; align-items: center; gap: 10px; padding: 11px 18px; border-radius: 999px; z-index: 950;
            background: linear-gradient(135deg, var(--julia), var(--billy)); color: #fff; font-weight: 600; font-size: .9em;
            border: none; cursor: pointer; box-shadow: var(--shadow); font-family: inherit; }
        .install-pill.show { display: inline-flex; animation: rise .4s ease both; }
        .install-pill .x { opacity: .85; font-weight: 700; padding-left: 4px; }

        /* Modal */
        .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(60,42,30,0.45);
            z-index: 1000; justify-content: center; align-items: center; backdrop-filter: blur(3px); padding: 16px; }
        .modal-overlay.active { display: flex; animation: fade .2s ease; }
        @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
        .modal { background: var(--card); border: 1px solid var(--border); border-radius: 20px; padding: 24px;
            width: 100%; max-width: 420px; box-shadow: var(--shadow); animation: pop .25s cubic-bezier(.2,.9,.3,1.2);
            max-height: 92vh; overflow-y: auto; }
        @keyframes pop { from { transform: translateY(18px) scale(.96); opacity: 0; } to { transform: none; opacity: 1; } }
        .modal h2 { margin-bottom: 18px; font-size: 1.4em; font-family: var(--serif); font-weight: 600; color: var(--accent); }

        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 6px; color: var(--muted); font-size: .8em; font-weight: 600;
            text-transform: uppercase; letter-spacing: .05em; }
        .form-group input, .form-group textarea, .form-group select {
            width: 100%; padding: 12px; border: 1px solid #e0d5c4; border-radius: 12px;
            background: var(--bg-1); color: var(--ink); font-size: 1em; font-family: inherit; transition: border-color .2s, box-shadow .2s; }
        .form-group input:focus, .form-group textarea:focus {
            outline: none; border-color: var(--julia); box-shadow: 0 0 0 3px rgba(194,105,63,.18); }
        .form-group textarea { resize: vertical; min-height: 74px; white-space: pre-wrap; }
        input[type="date"], input[type="time"] { color-scheme: light; }

        .checkbox-group { display: flex; align-items: center; gap: 10px; }
        .checkbox-group input { width: 18px; height: 18px; accent-color: var(--julia); }
        .checkbox-group label { margin: 0; text-transform: none; letter-spacing: 0; font-size: .95em; }

        .datetime-row { display: flex; gap: 10px; }
        .datetime-row input[type="date"] { flex: 1; }
        .datetime-row input[type="time"] { width: 124px; }

        .color-options { display: flex; gap: 12px; flex-wrap: wrap; }
        .color-option { width: 32px; height: 32px; border-radius: 50%; cursor: pointer; border: 2px solid transparent; transition: transform .15s, box-shadow .15s; }
        .color-option:hover { transform: scale(1.12); }
        .color-option.selected { box-shadow: 0 0 0 2px var(--card), 0 0 0 4px var(--ink); transform: scale(1.12); }

        .modal-buttons { display: flex; gap: 10px; margin-top: 22px; }
        .modal-buttons button { flex: 1; padding: 13px; border: none; border-radius: 12px; cursor: pointer;
            font-size: 1em; font-weight: 700; transition: filter .2s, transform .1s; font-family: inherit; }
        .modal-buttons button:active { transform: scale(.98); }
        .btn-save { background: linear-gradient(135deg, #cf7a4f, #b85733); color: #fff; }
        .btn-cancel { background: var(--panel); color: var(--ink); flex: 0 0 auto; padding-inline: 18px; }
        .btn-delete { background: #f3e0da; color: #b3392a; flex: 0 0 auto; padding-inline: 18px; }
        .modal-buttons button:hover { filter: brightness(1.05); }

        /* Toasts */
        #toasts { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(96px + var(--safe-bottom));
            z-index: 1500; display: flex; flex-direction: column; gap: 8px; align-items: center; pointer-events: none; width: max-content; max-width: 90vw; }
        .toast { padding: 11px 18px; border-radius: 12px; font-size: .9em; font-weight: 600; color: #fff;
            box-shadow: var(--shadow); animation: toastIn .25s ease both; }
        .toast.ok { background: linear-gradient(135deg, #7d9476, #5f7657); }
        .toast.err { background: linear-gradient(135deg, #c0563f, #a8412c); }
        .toast.info { background: linear-gradient(135deg, #cf7a4f, #b85733); }
        @keyframes toastIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }

        @media (max-width: 768px) {
            .container { padding: 14px 10px 120px; }
            #calendar { padding: 12px; }
            .fc .fc-toolbar { flex-direction: column; gap: 10px; }
            .fc .fc-toolbar-title { font-size: 1.3em; }
            .modal-overlay { align-items: flex-end; padding: 0; }
            .modal { max-width: 100%; border-radius: 22px 22px 0 0; padding-bottom: calc(24px + var(--safe-bottom));
                animation: sheet .3s cubic-bezier(.2,.9,.3,1); }
            @keyframes sheet { from { transform: translateY(100%); } to { transform: none; } }
        }
    </style>
</head>
<body>
    <div class="aurora"></div>
    <div class="offline-banner" id="offlineBanner">⚡ Offline — showing last loaded events</div>

    <div class="container">
        <header>
            <h1>
                <svg class="heart" viewBox="0 0 24 24" width="30" height="30" aria-hidden="true">
                    <path fill="#c2693f" d="M12 21s-6.7-4.2-9.4-8.1C.8 10.2 1.6 6.4 4.6 5.1 6.9 4.1 9.2 5 12 8c2.8-3 5.1-3.9 7.4-2.9 3 1.3 3.8 5.1 2 7.8C18.7 16.8 12 21 12 21z"/>
                </svg>
                <span>Billy &amp; Julia's Calendar</span>
            </h1>
            <p class="subtitle">Your shared space for plans and adventures</p>
        </header>

        <div class="cal-shell">
            <div id="calendar"></div>
            <div class="spinner-wrap" id="spinner"><div class="spinner"></div></div>
        </div>

        <div class="day-detail" id="dayDetail" hidden>
            <div class="day-detail-head">
                <h3 id="dayDetailTitle"></h3>
                <button class="dd-close" onclick="closeDayDetail()" aria-label="Close">✕</button>
            </div>
            <div id="dayDetailList"></div>
            <button class="dd-add" id="dayDetailAdd">＋ Add event</button>
        </div>
    </div>

    <button class="fab" onclick="addNewEvent()" aria-label="Add event">＋</button>

    <button class="install-pill" id="installPill">
        <span>📲 Add to Home Screen</span><span class="x" onclick="dismissInstall(event)">✕</span>
    </button>

    <div id="toasts"></div>

    <!-- Event Modal -->
    <div class="modal-overlay" id="eventModal">
        <div class="modal">
            <h2 id="modalTitle">Add Event</h2>
            <form id="eventForm">
                <input type="hidden" id="eventId">
                <div class="form-group">
                    <label>Title</label>
                    <input type="text" id="eventTitle" required placeholder="What's happening?">
                </div>
                <div class="form-group">
                    <label>Description (optional)</label>
                    <textarea id="eventDescription" placeholder="Add details..."></textarea>
                </div>
                <div class="form-group checkbox-group">
                    <input type="checkbox" id="eventAllDay" checked onchange="toggleTimeInputs()">
                    <label for="eventAllDay">All-day event</label>
                </div>
                <div class="form-group">
                    <label>Start</label>
                    <div class="datetime-row">
                        <input type="date" id="eventStartDate" required>
                        <input type="time" id="eventStartTime" class="time-input" style="display:none;">
                    </div>
                </div>
                <div class="form-group">
                    <label>End (optional)</label>
                    <div class="datetime-row">
                        <input type="date" id="eventEndDate">
                        <input type="time" id="eventEndTime" class="time-input" style="display:none;">
                    </div>
                </div>
                <div class="form-group">
                    <label>Color</label>
                    <div class="color-options">
                        <div class="color-option" style="background: #6f8769;" data-color="#6f8769"></div>
                        <div class="color-option" style="background: #c2693f;" data-color="#c2693f"></div>
                        <div class="color-option" style="background: #d9a441;" data-color="#d9a441"></div>
                        <div class="color-option" style="background: #b8607a;" data-color="#b8607a"></div>
                        <div class="color-option" style="background: #4f7a78;" data-color="#4f7a78"></div>
                        <div class="color-option" style="background: #c0392b;" data-color="#c0392b"></div>
                    </div>
                </div>
                <div class="modal-buttons">
                    <button type="button" class="btn-cancel" onclick="closeModal()">Cancel</button>
                    <button type="button" class="btn-delete" id="deleteBtn" style="display:none;" onclick="deleteEvent()">Delete</button>
                    <button type="submit" class="btn-save">Save</button>
                </div>
            </form>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.10/index.global.min.js"></script>
    <script>
        'use strict';
        let calendar;
        let selectedColor = '#c2693f';
        let allEvents = [];
        let selectedDayStr = null;
        let dayDetailOpen = false;

        const $ = (id) => document.getElementById(id);
        const LEGACY_DEFAULT = '#6366f1';            // old indigo default -> theme color
        const DEFAULT_COLOR = '#c2693f';             // terracotta
        const AUTHOR = 'Us';                         // single shared calendar

        function localDateStr(d = new Date()) {
            const off = d.getTimezoneOffset();
            return new Date(d.getTime() - off * 60000).toISOString().split('T')[0];
        }

        function toast(msg, kind = 'info', ms = 2600) {
            const el = document.createElement('div');
            el.className = 'toast ' + kind;
            el.textContent = msg;
            $('toasts').appendChild(el);
            setTimeout(() => {
                el.style.transition = 'opacity .3s, transform .3s';
                el.style.opacity = '0'; el.style.transform = 'translateY(8px)';
                setTimeout(() => el.remove(), 300);
            }, ms);
        }
        function showSpinner(on) { const el = $('spinner'); if (el) el.classList.toggle('show', on); }

        async function fetchEvents() {
            showSpinner(true);
            try {
                const res = await fetch('/api/events', { headers: { 'Accept': 'application/json' } });
                if (!res.ok) throw new Error('HTTP ' + res.status);
                const raw = await res.json();
                // Normalise the old indigo default to the theme color; keep custom colors
                allEvents = raw.map(e => {
                    const color = (!e.color || e.color === LEGACY_DEFAULT) ? DEFAULT_COLOR : e.color;
                    return Object.assign({}, e, { color });
                });
                try { localStorage.setItem('cachedEvents', JSON.stringify(allEvents)); } catch (e) {}
            } catch (err) {
                console.error('Failed to load events:', err);
                const cached = localStorage.getItem('cachedEvents');
                if (cached) { allEvents = JSON.parse(cached); toast('Offline — showing cached events', 'info'); }
                else { toast('Could not load events', 'err'); }
            } finally {
                showSpinner(false);
            }
            return allEvents;
        }

        document.addEventListener('DOMContentLoaded', function () {
            calendar = new FullCalendar.Calendar($('calendar'), {
                initialView: window.innerWidth < 768 ? 'listUpcoming' : 'dayGridMonth',
                height: 'auto',
                headerToolbar: { left: 'prev,next today', center: 'title', right: 'dayGridMonth,listUpcoming' },
                buttonText: { today: 'Today', month: 'Month' },
                views: {
                    listUpcoming: {
                        type: 'list',
                        duration: { days: 45 },
                        dateAlignment: 'day',          // start the range at today, not the 1st
                        buttonText: 'Agenda',
                        listDayFormat: { weekday: 'long', month: 'long', day: 'numeric' }
                    }
                },
                firstDay: 0,
                events: (info, success, failure) => { fetchEvents().then(success, failure); },
                editable: false,
                selectable: false,
                dayMaxEvents: 3,
                nowIndicator: true,
                eventContent: function (arg) {
                    const wrap = document.createElement('div');
                    wrap.className = 'ev';
                    const t = document.createElement('span');
                    t.className = 't';
                    const time = arg.timeText ? arg.timeText + ' ' : '';
                    t.textContent = time + arg.event.title;
                    wrap.appendChild(t);
                    return { domNodes: [wrap] };
                },
                // In Month view, tapping a day OR an event opens that day's panel below.
                // In Agenda (list) view there's no panel, so tapping an event edits it directly.
                dateClick: (info) => showDayDetail(info.dateStr, info.dayEl),
                eventClick: (info) => {
                    if (calendar.view.type.startsWith('dayGrid')) {
                        const ds = info.event.startStr.split('T')[0];
                        showDayDetail(ds, document.querySelector('.fc-daygrid-day[data-date="' + ds + '"]'));
                    } else {
                        openModal(info.event);
                    }
                },
                datesSet: (info) => { if (!info.view.type.startsWith('dayGrid')) closeDayDetail(); },
                eventsSet: () => { if (dayDetailOpen) renderDayDetail(); }
            });

            calendar.render();

            document.querySelectorAll('.color-option').forEach(opt => {
                opt.addEventListener('click', function () {
                    document.querySelectorAll('.color-option').forEach(o => o.classList.remove('selected'));
                    this.classList.add('selected');
                    selectedColor = this.dataset.color;
                });
            });

            $('eventForm').addEventListener('submit', (e) => { e.preventDefault(); saveEvent(); });
            $('eventModal').addEventListener('click', (e) => { if (e.target === e.currentTarget) closeModal(); });
            document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeModal(); });

            const updateOnline = () => $('offlineBanner').classList.toggle('show', !navigator.onLine);
            window.addEventListener('online', () => { updateOnline(); toast('Back online', 'ok'); calendar.refetchEvents(); });
            window.addEventListener('offline', updateOnline);
            updateOnline();

            registerSW();
        });

        // ---- Day detail panel ----
        function eventsOnDate(dateStr) {
            const ds = new Date(dateStr + 'T00:00:00');
            const de = new Date(ds.getTime() + 86400000);
            return calendar.getEvents().filter(ev => {
                const s = ev.start; if (!s) return false;
                const e = ev.end || new Date(s.getTime() + (ev.allDay ? 86400000 : 3600000));
                return s < de && e > ds;
            }).sort((a, b) => (a.allDay === b.allDay) ? (a.start - b.start) : (a.allDay ? -1 : 1));
        }

        function fmtTime(d) { return d.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' }); }

        function renderDayDetail() {
            const list = $('dayDetailList');
            list.innerHTML = '';
            const evs = eventsOnDate(selectedDayStr);
            if (!evs.length) {
                const empty = document.createElement('div');
                empty.className = 'dd-empty';
                empty.textContent = 'Nothing planned this day.';
                list.appendChild(empty);
            } else {
                evs.forEach(ev => {
                    const row = document.createElement('button');
                    row.className = 'dd-row';
                    row.style.borderLeftColor = ev.backgroundColor || DEFAULT_COLOR;

                    const title = document.createElement('div');
                    title.className = 'dd-title';
                    title.textContent = ev.title;
                    row.appendChild(title);

                    const meta = document.createElement('div');
                    meta.className = 'dd-meta';
                    let timeLabel = 'All day';
                    if (!ev.allDay && ev.start) {
                        timeLabel = fmtTime(ev.start);
                        if (ev.end && (ev.end - ev.start) < 86400000) timeLabel += ' – ' + fmtTime(ev.end);
                    }
                    const tSpan = document.createElement('span'); tSpan.textContent = timeLabel; meta.appendChild(tSpan);
                    row.appendChild(meta);

                    const desc = ev.extendedProps.description;
                    if (desc && desc.trim()) {
                        const d = document.createElement('div'); d.className = 'dd-desc'; d.textContent = desc;
                        row.appendChild(d);
                    }
                    row.onclick = () => openModal(ev);
                    list.appendChild(row);
                });
            }
            $('dayDetailAdd').onclick = () => openModal(null, selectedDayStr, null);
        }

        function showDayDetail(dateStr, dayEl) {
            selectedDayStr = dateStr;
            dayDetailOpen = true;
            document.querySelectorAll('.fc-daygrid-day.dd-selected').forEach(el => el.classList.remove('dd-selected'));
            if (dayEl) dayEl.classList.add('dd-selected');
            const d = new Date(dateStr + 'T00:00:00');
            $('dayDetailTitle').textContent = d.toLocaleDateString([], { weekday: 'long', month: 'long', day: 'numeric' });
            renderDayDetail();
            const panel = $('dayDetail');
            panel.hidden = false;
            setTimeout(() => panel.scrollIntoView({ behavior: 'smooth', block: 'nearest' }), 60);
        }

        function closeDayDetail() {
            dayDetailOpen = false;
            selectedDayStr = null;
            $('dayDetail').hidden = true;
            document.querySelectorAll('.fc-daygrid-day.dd-selected').forEach(el => el.classList.remove('dd-selected'));
        }

        function addNewEvent() { openModal(null, localDateStr(), null); }
        function toggleTimeInputs() {
            const allDay = $('eventAllDay').checked;
            document.querySelectorAll('.time-input').forEach(el => el.style.display = allDay ? 'none' : 'block');
        }

        function openModal(event, startDate, endDate) {
            const form = $('eventForm');
            form.reset();
            $('eventId').value = '';

            if (event) {
                $('modalTitle').textContent = 'Edit Event';
                $('eventId').value = event.id;
                $('eventTitle').value = event.title;
                $('eventDescription').value = event.extendedProps.description || '';
                const startParts = event.startStr.split('T');
                $('eventStartDate').value = startParts[0];
                if (startParts[1]) $('eventStartTime').value = startParts[1].substring(0, 5);
                if (event.endStr) {
                    const endParts = event.endStr.split('T');
                    $('eventEndDate').value = endParts[0];
                    if (endParts[1]) $('eventEndTime').value = endParts[1].substring(0, 5);
                }
                $('eventAllDay').checked = event.allDay;
                selectedColor = event.backgroundColor || DEFAULT_COLOR;
                $('deleteBtn').style.display = 'block';
            } else {
                $('modalTitle').textContent = 'Add Event';
                $('eventStartDate').value = startDate;
                $('eventEndDate').value = endDate && endDate !== startDate ? endDate : '';
                $('eventStartTime').value = '09:00';
                $('eventEndTime').value = '10:00';
                selectedColor = DEFAULT_COLOR;
                $('deleteBtn').style.display = 'none';
            }

            toggleTimeInputs();
            document.querySelectorAll('.color-option').forEach(opt =>
                opt.classList.toggle('selected', opt.dataset.color === selectedColor));
            $('eventModal').classList.add('active');
            setTimeout(() => $('eventTitle').focus(), 50);
        }
        function closeModal() { $('eventModal').classList.remove('active'); }

        async function saveEvent() {
            const eventId = $('eventId').value;
            const allDay = $('eventAllDay').checked;
            let startStr = $('eventStartDate').value;
            let endStr = $('eventEndDate').value || null;
            if (!startStr) { toast('Pick a start date', 'err'); return; }
            if (!allDay) {
                const st = $('eventStartTime').value || '00:00';
                const et = $('eventEndTime').value || '23:59';
                startStr += 'T' + st;
                if (endStr) endStr += 'T' + et;
            }
            const data = {
                title: $('eventTitle').value.trim(),
                description: $('eventDescription').value,
                start: startStr, end: endStr, allDay: allDay,
                color: selectedColor, createdBy: AUTHOR
            };
            const url = eventId ? `/api/events/${eventId}` : '/api/events';
            const method = eventId ? 'PUT' : 'POST';
            try {
                const res = await fetch(url, { method, headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(data) });
                if (!res.ok) throw new Error('HTTP ' + res.status);
                calendar.refetchEvents();
                closeModal();
                toast(eventId ? 'Event updated' : 'Event added', 'ok');
            } catch (err) {
                console.error('Error saving event:', err);
                toast('Could not save — check your connection', 'err');
            }
        }

        async function deleteEvent() {
            const eventId = $('eventId').value;
            if (!eventId) return;
            if (!confirm('Delete this event?')) return;
            try {
                const res = await fetch(`/api/events/${eventId}`, { method: 'DELETE' });
                if (!res.ok) throw new Error('HTTP ' + res.status);
                calendar.refetchEvents();
                closeModal();
                toast('Event deleted', 'ok');
            } catch (err) {
                console.error('Error deleting event:', err);
                toast('Could not delete event', 'err');
            }
        }

        // PWA install
        let deferredPrompt = null;
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            if (localStorage.getItem('installDismissed') !== '1') $('installPill').classList.add('show');
        });
        $('installPill').addEventListener('click', async () => {
            if (!deferredPrompt) return;
            deferredPrompt.prompt();
            await deferredPrompt.userChoice;
            deferredPrompt = null;
            $('installPill').classList.remove('show');
        });
        function dismissInstall(e) {
            e.stopPropagation();
            localStorage.setItem('installDismissed', '1');
            $('installPill').classList.remove('show');
        }
        window.addEventListener('appinstalled', () => { $('installPill').classList.remove('show'); toast('Installed!', 'ok'); });

        function registerSW() {
            if ('serviceWorker' in navigator) {
                navigator.serviceWorker.register('sw.js').catch(err => console.warn('SW registration failed:', err));
            }
        }
    </script>
</body>
</html>

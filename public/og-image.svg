<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="630" fill="#f8fafc"/>

  <!-- Grid pattern -->
  <defs>
    <pattern id="grid" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#e2e8f0" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="100%" height="100%" fill="url(#grid)"/>

  <!-- Logo mark -->
  <g transform="translate(100, 250)">
    <rect x="2" y="2" width="56" height="56" rx="8" stroke="#1e293b" stroke-width="4"/>
    <rect x="14" y="14" width="14" height="14" fill="#1e293b"/>
    <rect x="34" y="14" width="14" height="14" fill="#1e293b"/>
    <rect x="14" y="34" width="14" height="14" fill="#1e293b"/>
    <rect x="34" y="34" width="14" height="14" fill="#1e293b"/>
  </g>

  <!-- Text -->
  <text x="180" y="295" font-family="system-ui, -apple-system, sans-serif" font-size="48" font-weight="500" fill="#0f172a">Bilco Works</text>
  <text x="100" y="360" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#64748b">HRIS &amp; Systems Consulting</text>

  <!-- Tagline -->
  <text x="100" y="430" font-family="system-ui, -apple-system, sans-serif" font-size="20" fill="#94a3b8">Enterprise implementations that work on day one</text>

  <!-- Domain -->
  <text x="100" y="530" font-family="system-ui, -apple-system, sans-serif" font-size="18" fill="#64748b">bilcoworks.com</text>
</svg>

<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500&amp;family=Inter:wght@400;500&amp;display=swap');
      .display { font-family: 'Space Grotesk', system-ui, -apple-system, sans-serif; }
      .sans    { font-family: 'Inter', system-ui, -apple-system, sans-serif; }
    </style>
    <pattern id="grid" x="0" y="0" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M 48 0 L 0 0 0 48" fill="none" stroke="#EAF0F1" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
    <radialGradient id="glow" cx="18%" cy="0%" r="70%">
      <stop offset="0%" stop-color="#4ED8C8" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#4ED8C8" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="#0B1216"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- Logo mark (cascading squares, as in favicon) -->
  <g transform="translate(88, 66) scale(1.5)">
    <rect x="2" y="2" width="12" height="12" fill="#4ED8C8"/>
    <rect x="18" y="6" width="12" height="12" fill="#4ED8C8" opacity="0.6"/>
    <rect x="6" y="18" width="12" height="12" fill="#4ED8C8" opacity="0.35"/>
  </g>
  <text class="display" x="156" y="104" font-size="30" font-weight="500" fill="#EAF0F1" letter-spacing="-0.5">Bilco Works</text>

  <!-- Headline -->
  <text class="display" x="88" y="308" font-size="64" font-weight="500" fill="#EAF0F1" letter-spacing="-1.6">We build systems that</text>
  <text class="display" x="88" y="386" font-size="64" font-weight="500" fill="#4ED8C8" letter-spacing="-1.6">can&#8217;t afford to be wrong.</text>

  <!-- Hairline -->
  <rect x="88" y="452" width="1024" height="1" fill="#EAF0F1" fill-opacity="0.12"/>

  <!-- Practices -->
  <text class="sans" x="88" y="502" font-size="22" fill="#94A8B0" letter-spacing="0.2">HR &amp; Payroll &#183; AI &#183; Research &#183; Infrastructure</text>

  <!-- Domain -->
  <text class="sans" x="88" y="556" font-size="20" font-weight="500" fill="#748992">bilcoworks.com</text>
</svg>
